# Настройки git-cliff: CHANGELOG.md и заметки к релизам из Conventional Commits.
[changelog]
header = """
# Журнал изменений

Формат основан на Conventional Commits; версии следуют SemVer.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Не выпущено]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Добавлено" },
  { message = "^fix", group = "<!-- 2 -->Исправлено" },
  { message = "^sec", group = "<!-- 3 -->Безопасность" },
  { message = "^perf", group = "<!-- 1 -->Изменено" },
  { message = "^refactor", group = "<!-- 1 -->Изменено" },
  { message = "^build", group = "<!-- 1 -->Изменено" },
  { message = "^docs", group = "<!-- 1 -->Изменено" },
  { message = "^chore: bump version", skip = true },
  { message = "^(chore|ci|test)", skip = true },
]
tag_pattern = "v[0-9].*"
